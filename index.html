<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080e1a">
<title>N5 Kanji — z2i_Mashrafe</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700;900&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{
  /* ── MIDNIGHT BLUE THEME ── */
  --bg:#080e1a;--surf:#0f1829;--surf2:#162035;--surf3:#1e2b45;
  --bdr:#1e3050;--bdr2:#2a4068;
  --gold:#60b8f0;--gold2:#2a7ec8;--goldf:rgba(96,184,240,.12);
  --red:#f07070;--redf:rgba(240,112,112,.1);
  --green:#50d090;--greenf:rgba(80,208,144,.1);
  --purple:#8890f8;--purplef:rgba(136,144,248,.12);
  --teal:#50c8e8;--tealf:rgba(80,200,232,.1);
  --text:#cdd8f0;--muted:#4a6090;--light:#8aA4cc;
  --nav-h:56px;--bot-h:64px;
  --r:16px;--rsm:12px;--rxs:8px;
  --bn:'Noto Serif Bengali',serif;
  --jp:'Noto Sans JP',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;scroll-behavior:smooth;}
body{
  background:var(--bg);color:var(--text);font-family:var(--bn);
  min-height:100dvh;
  padding-top:var(--nav-h);
  padding-bottom:calc(var(--bot-h) + env(safe-area-inset-bottom,0px));
  overscroll-behavior:none;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 40% at 10% 10%,rgba(30,80,180,.10) 0%,transparent 60%),
    radial-gradient(ellipse 60% 50% at 90% 90%,rgba(60,160,240,.06) 0%,transparent 60%);
}
.wm{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden;}
.wm::before{
  content:'z2i_mash z2i_mash z2i_mash z2i_mash z2i_mash z2i_mash z2i_mash z2i_mash z2i_mash z2i_mash z2i_mash z2i_mash';
  position:absolute;top:-60px;left:-80px;width:200%;height:200%;
  font-family:var(--jp);font-size:13px;font-weight:700;letter-spacing:.4em;
  color:rgba(96,184,240,.018);word-spacing:50px;line-height:5.5em;
  transform:rotate(-25deg);
}

/* ── TOP NAV ── */
.top-nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  height:var(--nav-h);
  background:rgba(8,14,26,.97);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bdr);
  display:flex;align-items:center;padding:0 16px;gap:10px;
}
.nav-logo{
  font-family:var(--jp);font-size:26px;font-weight:900;
  background:linear-gradient(135deg,#60b8f0,#a0d8ff,#2a7ec8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  flex-shrink:0;
}
.nav-title{
  font-size:13px;font-weight:600;color:var(--light);flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-badge{
  font-family:var(--jp);font-size:8px;letter-spacing:.12em;
  color:var(--gold);background:var(--goldf);
  border:1px solid rgba(96,184,240,.2);
  padding:3px 9px;border-radius:20px;flex-shrink:0;
}
.nav-socials{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.nsoc{
  width:28px;height:28px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff;text-decoration:none;
  transition:transform .18s,opacity .18s;flex-shrink:0;
}
.nsoc:active{transform:scale(.9);}
.nsoc:hover{opacity:.85;transform:scale(1.08);}
.nsoc-fb{background:#0f1829;border:1px solid #1e3050;}
.nsoc-ig{background:#0f1829;border:1px solid #1e3050;}
.nsoc-x{background:#0f1829;border:1px solid #1e3050;}
.nsoc-gh{background:#0f1829;border:1px solid #1e3050;}

/* ── BOTTOM NAV ── */
.bot-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:var(--bot-h);
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:rgba(8,14,26,.97);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--bdr);
  display:grid;grid-template-columns:repeat(3,1fr);
}
.bnav-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;padding:8px 4px 10px;
  background:none;border:none;cursor:pointer;
  color:var(--muted);transition:color .2s;position:relative;
}
.bnav-btn.active{color:var(--gold);}
.bnav-btn.active::after{
  content:'';position:absolute;top:0;left:20%;right:20%;
  height:2px;background:var(--gold);border-radius:0 0 2px 2px;
}
.bnav-icon{width:28px;height:28px;line-height:1;display:flex;align-items:center;justify-content:center;}
.bnav-icon svg{width:28px;height:28px;transition:transform .2s;}
.bnav-btn.active .bnav-icon svg{transform:scale(1.15);}
.bnav-lbl{font-size:8px;line-height:1;font-family:var(--bn);letter-spacing:.01em;}

/* ── PAGES ── */
.page{display:none;position:relative;z-index:2;}
.page.active{display:block;}
.wrap{max-width:480px;margin:0 auto;padding:14px 13px 20px;}

/* ── PAGE HEADER ── */
.phdr{text-align:center;padding:12px 0 16px;margin-bottom:12px;border-bottom:1px solid var(--bdr);}
.phdr-jp{
  font-family:var(--jp);font-size:54px;font-weight:900;line-height:1;margin-bottom:6px;
  background:linear-gradient(135deg,#60b8f0,#c0e8ff,#2a7ec8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.phdr-jp.teal{background:linear-gradient(135deg,#50c8e8,#a0ecff,#2090b8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.phdr-jp.purple{background:linear-gradient(135deg,#8890f8,#c0c8ff,#5058d0);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.phdr-ttl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text);margin-bottom:3px;}
.phdr-sub{font-size:11px;color:var(--muted);}
.phdr-by{
  display:inline-block;margin-top:9px;
  font-family:var(--jp);font-size:9px;letter-spacing:.16em;
  color:var(--gold);background:var(--goldf);
  border:1px solid rgba(96,184,240,.2);padding:3px 12px;border-radius:20px;
}

/* ── STATS ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:11px;}
.sbox{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rsm);padding:8px 3px;text-align:center;}
.sv{font-family:var(--jp);font-size:20px;font-weight:700;line-height:1;margin-bottom:2px;}
.sl{font-size:9px;color:var(--muted);}

/* ── MODE BAR ── */
.mode-bar{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:11px;}
.mbtn{
  padding:10px 4px;background:var(--surf);border:1.5px solid var(--bdr);
  border-radius:var(--rsm);color:var(--muted);cursor:pointer;
  font-family:var(--jp);font-size:11px;text-align:center;
  transition:all .18s;min-height:44px;
  display:flex;align-items:center;justify-content:center;
}
.mbtn.active{background:var(--goldf);border-color:var(--gold);color:var(--gold);}

/* ── GAME CARD ── */
.gcard{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:var(--r);padding:18px 14px;
  margin-bottom:11px;text-align:center;position:relative;overflow:hidden;
}
.gcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#2a7ec8,#60b8f0,#2a7ec8);}
.gcard.teal{border-color:rgba(48,192,176,.2);}
.gcard.teal::before{background:linear-gradient(90deg,#1a7a74,var(--teal),#1a7a74);}

/* progress */
.pwrap{display:flex;align-items:center;gap:8px;margin-bottom:13px;}
.pbar{flex:1;height:4px;background:var(--bdr);border-radius:2px;overflow:hidden;}
.pfill{height:100%;background:linear-gradient(90deg,#2a7ec8,#60b8f0);border-radius:2px;transition:width .4s;}
.pfill.teal{background:linear-gradient(90deg,#2090b8,#50c8e8);}
.ptxt{font-family:var(--jp);font-size:10px;color:var(--muted);white-space:nowrap;}

/* display */
.qlbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.kbig{font-family:var(--jp);font-size:96px;font-weight:900;line-height:1;color:var(--text);margin-bottom:6px;transition:all .3s;}
.kbig.shake{animation:shake .4s ease;}
.kbig.pop{animation:pop .3s ease;color:var(--green);}
.kana-big{font-family:var(--jp);font-size:54px;font-weight:900;line-height:1;color:var(--text);margin-bottom:4px;transition:all .3s;}
.kana-big.shake{animation:shake .4s ease;}
.kana-big.pop{animation:pop .3s ease;}
.kana-roma{font-family:var(--jp);font-size:13px;color:var(--muted);margin-bottom:14px;}
.khint{font-family:var(--jp);font-size:15px;color:var(--muted);margin-bottom:13px;}
.comp-big{font-family:var(--jp);font-size:74px;font-weight:900;line-height:1;color:var(--text);margin-bottom:5px;transition:all .3s;letter-spacing:.04em;}
.comp-big.shake{animation:shake .4s ease;}
.comp-big.pop{animation:pop .3s ease;color:var(--green);}
.comp-kana{font-family:var(--jp);font-size:18px;color:var(--teal);margin-bottom:3px;}
.comp-roma{font-family:var(--jp);font-size:12px;color:var(--muted);margin-bottom:16px;}

/* options */
.ogrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.opt{
  background:var(--surf2);border:1.5px solid var(--bdr);
  border-radius:var(--rsm);padding:14px 8px;
  cursor:pointer;transition:border-color .18s,background .18s;
  text-align:center;position:relative;
  min-height:54px;display:flex;align-items:center;justify-content:center;
}
.opt:active:not(:disabled){transform:scale(.96);}
.opt:disabled{cursor:default;}
.opt.correct{border-color:var(--green);background:var(--greenf);}
.opt.wrong{border-color:var(--red);background:var(--redf);}
.opt-jp{font-family:var(--jp);font-size:38px;font-weight:700;color:var(--text);}
.opt-kana{font-family:var(--jp);font-size:16px;font-weight:700;color:var(--text);}
.opt-txt{font-size:13px;font-weight:700;color:var(--text);line-height:1.4;}
.opt-tick{position:absolute;top:5px;right:7px;font-size:12px;opacity:0;}
.opt.correct .opt-tick{opacity:1;}

/* feedback */
.fb{margin-top:11px;padding:10px 12px;border-radius:var(--rxs);font-size:12px;line-height:1.7;display:none;}
.fb.show{display:block;animation:fadeIn .25s ease;}
.fb-ok{background:var(--greenf);border:1px solid rgba(64,192,112,.22);color:#80e8a8;}
.fb-no{background:var(--redf);border:1px solid rgba(224,80,80,.2);color:#f0a0a0;}

/* next */
.nbtn{
  width:100%;margin-top:11px;
  background:linear-gradient(135deg,#2a7ec8,#60b8f0);
  color:var(--bg);border:none;border-radius:var(--rsm);
  padding:14px;font-size:14px;font-weight:700;
  cursor:pointer;display:none;min-height:48px;
}
.nbtn.show{display:block;animation:fadeIn .25s ease;}
.nbtn:active{opacity:.87;}
.nbtn.teal{background:linear-gradient(135deg,#2090b8,#50c8e8);}

/* ── RESULT ── */
.result{display:none;text-align:center;background:var(--surf);border:1px solid var(--bdr);border-radius:var(--r);padding:28px 18px;}
.result.show{display:block;animation:fadeIn .35s ease;}
.rbig{font-size:62px;line-height:1;margin-bottom:8px;}
.rtitle{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;}
.rsub{font-size:12px;color:var(--muted);margin-bottom:12px;}
.rscore{font-family:var(--jp);font-size:32px;font-weight:900;color:var(--gold);margin-bottom:5px;}
.rdetail{font-size:11px;color:var(--light);margin-bottom:20px;line-height:1.8;}
.rbtn{
  background:linear-gradient(135deg,#2a7ec8,#60b8f0);
  color:var(--bg);border:none;border-radius:var(--rsm);
  padding:13px 30px;font-size:14px;font-weight:700;cursor:pointer;min-height:48px;
}

/* ── MOTIVATION QUOTE ── */
.mqbox{
  margin:18px 0 4px;
  background:linear-gradient(135deg,rgba(96,184,240,.07),rgba(136,144,248,.07));
  border:1px solid rgba(96,184,240,.18);
  border-left:3px solid var(--gold);
  border-radius:var(--rxs);
  padding:13px 15px;
  text-align:left;
  animation:fadeIn .5s ease;
}
.mq-text{
  font-size:13px;font-style:italic;color:var(--text);line-height:1.6;
  margin-bottom:6px;
}
.mq-text::before{content:'\201C';font-size:20px;color:var(--gold);line-height:0;vertical-align:-4px;margin-right:2px;}
.mq-text::after{content:'\201D';font-size:20px;color:var(--gold);line-height:0;vertical-align:-4px;margin-left:2px;}
.mq-author{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--gold);text-align:right;}

/* ── REFERENCE ── */
.ref{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rsm);padding:11px;margin-top:12px;}
.ref-ttl{font-family:var(--jp);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.ref-ttl::after{content:'';flex:1;height:1px;background:var(--bdr);}
.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:4px;}
.ri{background:var(--surf2);border:1px solid var(--bdr);border-radius:6px;padding:6px 4px;text-align:center;cursor:pointer;transition:border-color .15s,transform .15s;}
.ri:active{border-color:var(--purple);transform:scale(.94);}
.ri-k{font-family:var(--jp);font-size:19px;font-weight:700;color:var(--text);}
.ri-r{font-family:var(--jp);font-size:7px;color:var(--muted);margin-top:1px;}
.ri-m{font-size:7.5px;color:var(--light);margin-top:1px;}
.cref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:5px;}
.cri{background:var(--surf2);border:1px solid var(--bdr);border-left:3px solid var(--teal);border-radius:0 7px 7px 0;padding:7px 8px;cursor:pointer;transition:border-color .15s,transform .15s;}
.cri:active{border-color:var(--teal);transform:scale(.96);}
.cri-k{font-family:var(--jp);font-size:20px;font-weight:700;color:var(--text);}
.cri-r{font-family:var(--jp);font-size:8px;color:var(--teal);margin-top:1px;}
.cri-m{font-size:9px;color:var(--light);margin-top:2px;font-weight:600;}

/* ── REFERENCE SELECT MODE ── */
.ref.selmode .ri{border-color:var(--bdr2);}
.ref.selmode .ri.picked{border-color:var(--gold);background:var(--goldf);}
.ref.selmode .cri.picked{border-color:var(--teal);background:var(--tealf);}
.ri.picked::after,.cri.picked::after{content:'✓';position:absolute;}
.ri{position:relative;}.cri{position:relative;}
.ri-check,.cri-check{
  position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;
  background:var(--gold);color:#0a1020;font-size:9px;font-weight:900;
  display:none;align-items:center;justify-content:center;line-height:1;
}
.cri-check{background:var(--teal);}
.ri.picked .ri-check,.cri.picked .cri-check{display:flex;}
.sel-bar{
  display:none;align-items:center;justify-content:space-between;gap:8px;
  margin-bottom:9px;flex-wrap:wrap;
}
.sel-bar.show{display:flex;}
.sel-bar-l{display:flex;gap:5px;flex-wrap:wrap;}
.sel-count{font-size:11px;color:var(--muted);white-space:nowrap;}
.sel-count b{color:var(--gold);}
.sel-count.teal b{color:var(--teal);}

/* ── RADICAL PAGE ── */
.rad-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:12px;}
.rstat{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rsm);padding:9px 5px;text-align:center;}
.rstat-v{font-family:var(--jp);font-size:22px;font-weight:700;color:var(--teal);}
.rstat-l{font-size:9px;color:var(--muted);margin-top:2px;}
.rad-search{
  width:100%;background:var(--surf);border:1.5px solid var(--bdr);
  border-radius:var(--rsm);padding:11px 14px;
  color:var(--text);font-size:14px;
  margin-bottom:11px;outline:none;transition:border-color .2s;min-height:48px;
}
.rad-search:focus{border-color:var(--gold);}
.rad-search::placeholder{color:var(--muted);}
.rad-filter{
  display:flex;gap:6px;margin-bottom:12px;
  overflow-x:auto;padding-bottom:3px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.rad-filter::-webkit-scrollbar{display:none;}
.rfbtn{
  background:var(--surf);border:1px solid var(--bdr);
  border-radius:20px;padding:7px 13px;
  font-family:var(--jp);font-size:13px;color:var(--muted);
  cursor:pointer;transition:all .18s;white-space:nowrap;flex-shrink:0;min-height:36px;
}
.rfbtn.active{background:var(--goldf);border-color:var(--gold);color:var(--gold);}
.rfbtn:active{opacity:.8;}
.rad-group{background:var(--surf);border:1px solid var(--bdr);border-radius:var(--rsm);margin-bottom:7px;overflow:hidden;}
.rad-ghdr{
  display:flex;align-items:center;gap:9px;padding:11px 12px;
  cursor:pointer;transition:background .18s;user-select:none;
}
.rad-ghdr:active{background:var(--surf2);}
.rad-ghdr.open{background:rgba(144,96,208,.07);border-bottom:1px solid var(--bdr);}
.rad-sym{font-family:var(--jp);font-size:28px;font-weight:900;min-width:36px;text-align:center;line-height:1;}
.rad-nw{flex:1;min-width:0;}
.rad-nm{font-family:var(--jp);font-size:12px;font-weight:700;color:var(--text);line-height:1.3;}
.rad-nm-bn{font-size:10px;color:var(--muted);margin-top:1px;}
.rad-cnt{font-family:var(--jp);font-size:10px;padding:2px 7px;border-radius:10px;white-space:nowrap;flex-shrink:0;}
.rad-chev{font-size:10px;color:var(--muted);transition:transform .22s;flex-shrink:0;}
.rad-ghdr.open .rad-chev{transform:rotate(90deg);}
.rad-body{display:none;padding:10px 10px 12px;animation:fadeIn .2s ease;}
.rad-body.open{display:block;}
.rad-kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:5px;}
.rk{background:var(--surf2);border:1px solid var(--bdr);border-radius:var(--rxs);padding:8px 4px;text-align:center;cursor:pointer;transition:border-color .15s,transform .15s;}
.rk:active{border-color:var(--gold);transform:scale(.94);}
.rk:hover{border-color:var(--bdr2);}
.rk-k{font-family:var(--jp);font-size:28px;font-weight:900;color:var(--text);line-height:1.1;}
.rk-r{font-family:var(--jp);font-size:7.5px;color:var(--teal);margin-top:2px;line-height:1.4;}
.rk-m{font-size:8.5px;color:var(--light);margin-top:2px;font-weight:600;}
.rad-note{
  font-size:11px;color:var(--muted);
  padding:8px 10px;background:rgba(144,96,208,.05);
  border-radius:7px;margin-top:8px;line-height:1.7;
  border-left:2px solid var(--gold);
}

/* ── KANJI DETAIL MODAL ── */
.kmodal-backdrop{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  animation:fadeIn .2s ease;
}
.kmodal-backdrop.hide{display:none;}
.kmodal{
  background:var(--surf);border:1px solid var(--bdr2);
  border-radius:20px;width:100%;max-width:320px;
  padding:24px 20px 20px;text-align:center;position:relative;
  animation:modalPop .22s ease;
}
@keyframes modalPop{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.kmodal-close{
  position:absolute;top:12px;right:14px;
  background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;
  color:var(--muted);font-size:16px;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

// ── PROGRESS SAVE/RESUME (localStorage) ──
function p1SaveState(){
  try{
    localStorage.setItem('p1_progress',JSON.stringify({
      qsIdx:p1.qs.map(o=>DB1.indexOf(o)),cur:p1.cur,score:p1.score,c:p1.c,w:p1.w,streak:p1.streak,ms:p1.ms,mode:p1.mode,customMode:p1CustomMode,picked:[...p1Picked]
    }));
  }catch(e){}
}
function p1ClearState(){try{localStorage.removeItem('p1_progress');}catch(e){}}
function p1LoadState(){
  try{
    const raw=localStorage.getItem('p1_progress');if(!raw)return false;
    const s=JSON.parse(raw);
    if(!s||!Array.isArray(s.qsIdx)||!s.qsIdx.length||typeof s.cur!=='number'||s.cur>=s.qsIdx.length)return false;
    p1.qs=s.qsIdx.map(i=>DB1[i]);
    if(p1.qs.some(x=>x===undefined))return false;
    p1.cur=s.cur;p1.score=s.score;p1.c=s.c;p1.w=s.w;p1.streak=s.streak;p1.ms=s.ms;p1.mode=s.mode;p1.ans=false;
    p1CustomMode=!!s.customMode;
    if(Array.isArray(s.picked)){
      p1Picked=new Set(s.picked);
      p1Picked.forEach(i=>{const el=document.getElementById('p1-ri'+i);if(el)el.classList.add('picked');});
      p1UpdSelCount();
    }
    ['p1m1','p1m2','p1m3'].forEach(id=>{const e=document.getElementById(id);e.classList.remove('active');e.style.cssText='';});
    document.getElementById({k2m:'p1m1',k2r:'p1m2',kn2k:'p1m3'}[p1.mode]).classList.add('active');
    p1Upd();
    document.getElementById('p1-area').style.display='block';
    document.getElementById('p1-res').className='result';
    document.getElementById('p1-mq').style.display='none';
    document.getElementById('p1-ref').style.display=p1CustomMode?'none':'block';
    p1Render();
    return true;
  }catch(e){return false;}
}

let p1={mode:'k2m',qs:[],cur:0,score:0,c:0,w:0,streak:0,ms:0,ans:false};
let p1CustomMode=false;
let p1SelMode=false;
let p1Picked=new Set();
function p1ToggleSel(){
  p1SelMode=!p1SelMode;
  const btn=document.getElementById('p1-sel-toggle');
  const lbl=document.getElementById('p1-sel-toggle-lbl');
  const bar=document.getElementById('p1-sel-bar');
  const ref=document.getElementById('p1-ref');
  btn.classList.toggle('on',p1SelMode);
  bar.classList.toggle('show',p1SelMode);
  ref.classList.toggle('selmode',p1SelMode);
  lbl.textContent=p1SelMode?'Select বন্ধ করো':'নিচের লিস্ট থেকে Kanji বেছে নাও (Custom Practice)';
  document.getElementById('p1-sel-start').classList.toggle('show',p1SelMode);
  if(!p1SelMode){p1SelNone();}
  else{ref.scrollIntoView({behavior:'smooth',block:'start'});}
}
function p1RefClick(i,kanji){
  if(p1SelMode){p1ToggleK(i);}
  else{kmodalShow(kanji,'#9060d0');}
}
function p1ToggleK(i){
  const el=document.getElementById('p1-ri'+i);
  if(p1Picked.has(i)){p1Picked.delete(i);el.classList.remove('picked');}
  else{p1Picked.add(i);el.classList.add('picked');}
  p1UpdSelCount();
}
function p1UpdSelCount(){
  document.getElementById('p1-sel-count').innerHTML=`<b>${p1Picked.size}</b> টি selected`;
  document.getElementById('p1-sel-start').disabled=p1Picked.size<4;
}
function p1SelAll(){
  p1Picked=new Set(DB1.map((_,i)=>i));
  document.querySelectorAll('#p1-rg .ri').forEach(e=>e.classList.add('picked'));
  p1UpdSelCount();
}
function p1SelNone(){
  p1Picked.clear();
  document.querySelectorAll('#p1-rg .ri').forEach(e=>e.classList.remove('picked'));
  p1UpdSelCount();
}
function p1SelRandom(){
  p1SelNone();
  const n=Math.min(10,DB1.length);
  const idxs=shuffle(DB1.map((_,i)=>i)).slice(0,n);
  idxs.forEach(i=>{p1Picked.add(i);document.getElementById('p1-ri'+i).classList.add('picked');});
  p1UpdSelCount();
}
function p1StartCustom(){
  if(p1Picked.size<4)return;
  p1CustomMode=true;
  const chosen=[...p1Picked].map(i=>DB1[i]);
  p1.qs=shuffle([...chosen]);
  p1.cur=0;p1.score=0;p1.c=0;p1.w=0;p1.streak=0;p1.ms=0;p1.ans=false;
  // close sel mode UI without clearing picked
  if(p1SelMode){
    p1SelMode=false;
    document.getElementById('p1-sel-toggle').classList.remove('on');
    document.getElementById('p1-sel-bar').classList.remove('show');
    document.getElementById('p1-ref').classList.remove('selmode');
    document.getElementById('p1-sel-toggle-lbl').textContent='নিচের লিস্ট থেকে Kanji বেছে নাও (Custom Practice)';
    document.getElementById('p1-sel-start').classList.remove('show');
  }
  p1Upd();
  document.getElementById('p1-area').style.display='block';
  document.getElementById('p1-res').className='result';
  document.getElementById('p1-mq').style.display='none';
  document.getElementById('p1-ref').style.display='none';
  p1Render();
  document.getElementById('p1-area').scrollIntoView({behavior:'smooth',block:'start'});
  p1SaveState();
}
function p1RepeatCustom(){
  p1CustomMode=true;
  const chosen=[...p1Picked].map(i=>DB1[i]);
  p1.qs=shuffle([...chosen]);
  p1.cur=0;p1.score=0;p1.c=0;p1.w=0;p1.streak=0;p1.ms=0;p1.ans=false;
  p1Upd();
  document.getElementById('p1-res').className='result';
  document.getElementById('p1-mq').style.display='none';
  document.getElementById('p1-repeat-btn').style.display='none';
  document.getElementById('p1-area').style.display='block';
  document.getElementById('p1-ref').style.display='none';
  p1Render();
  document.getElementById('p1-area').scrollIntoView({behavior:'smooth',block:'start'});
  p1SaveState();
}
function p1NewKanjiBtn(){
  if(!p1CustomMode){p1Restart();return;}
  // clear old custom selection
  p1Picked.clear();
  document.querySelectorAll('#p1-rg .ri').forEach(e=>e.classList.remove('picked'));
  p1UpdSelCount();
  // go straight to the kanji list, no extra page change
  document.getElementById('p1-area').style.display='none';
  document.getElementById('p1-res').className='result';
  document.getElementById('p1-mq').style.display='none';
  document.getElementById('p1-ref').style.display='block';
  p1ClearState();
  // auto-enable select mode so a tap on a kanji selects it immediately
  if(!p1SelMode){
    p1SelMode=true;
    document.getElementById('p1-sel-toggle').classList.add('on');
    document.getElementById('p1-sel-bar').classList.add('show');
    document.getElementById('p1-ref').classList.add('selmode');
    document.getElementById('p1-sel-toggle-lbl').textContent='Select বন্ধ করো';
    document.getElementById('p1-sel-start').classList.add('show');
  }
  document.getElementById('p1-ref').scrollIntoView({behavior:'smooth',block:'start'});
}
function p1Mode(m){
  p1.mode=m;
  ['p1m1','p1m2','p1m3'].forEach(id=>{const e=document.getElementById(id);e.classList.remove('active');e.style.cssText='';});
  document.getElementById({k2m:'p1m1',k2r:'p1m2',kn2k:'p1m3'}[m]).classList.add('active');
  p1Restart();
}
function p1Restart(){
  p1CustomMode=false;
  p1.qs=shuffle([...DB1]).slice(0,TOTAL);p1.cur=0;p1.score=0;p1.c=0;p1.w=0;p1.streak=0;p1.ms=0;p1.ans=false;

  document.getElementById('p1-ref').style.display='block';

    document.getElementById('km-m').textContent = d.m;

    // reset kun tag label (may have been changed by compound modal)
    document.getElementById('km-kun-row').querySelector('.kmodal-tag').textContent = 'くんよみ';

    // split kun/on: format is "くんよみ・おんよみ"
    const parts = d.r.split('・');
    const kunRow = document.getElementById('km-kun-row');
    const onRow  = document.getElementById('km-on-row');

    if(parts.length >= 2){
      document.getElementById('km-kun').textContent = parts[0];
      document.getElementById('km-on').textContent  = parts[1];
      kunRow.style.display = 'flex';
      onRow.style.display  = 'flex';
    } else {
      // only one reading — show as kun if hiragana-ish, else on
      const isHira = /^[ぁ-ん]/.test(parts[0]);
      if(isHira){
        document.getElementById('km-kun').textContent = parts[0];
        kunRow.style.display = 'flex';
        onRow.style.display  = 'none';
      } else {
        document.getElementById('km-on').textContent = parts[0];
        kunRow.style.display = 'none';
        onRow.style.display  = 'flex';
      }
    }

    document.getElementById('km-ro').textContent = d.ro;

    // find which RG group this kanji belongs to
    const grp = RG.find(g=>g.k.some(x=>x.k===kanji));
    const radEl = document.getElementById('km-rad');
    if(grp){
      radEl.innerHTML = `🧩 Radical: <b style="color:${grp.c};font-family:var(--jp)">${grp.s}</b> — ${grp.bn}`;
      radEl.style.display = 'block';
    } else {
      radEl.style.display = 'none';
    }
  }

  document.getElementById('kmodal-bd').classList.remove('hide');
  document.body.style.overflow = 'hidden';
}
function kmodalHide(){
  document.getElementById('kmodal-bd').classList.add('hide');
  document.body.style.overflow = '';
}
function kmodalClose(e){
  if(e.target === document.getElementById('kmodal-bd')) kmodalHide();
}

// INIT
renderRefs();p3Init();
if(!p1LoadState())p1Restart();
if(!p2LoadState())p2Restart();
</script>
